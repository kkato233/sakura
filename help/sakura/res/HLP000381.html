<h2>Windows Terminalを開く</h2>
ファイルの場所をWindows Terminalで開きます。
起動時のカレントディレクトリをファイルのあるフォルダーに設定し、
<code>-d .</code>を指定してWindows Terminalの開始ディレクトリとして使用します。
既定のプロファイルやシェル、環境変数の設定は変更しません。
